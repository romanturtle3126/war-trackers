name: Build Android APK

# Builds a signed release APK and attaches it to a GitHub Release.
# Runs when the app itself changes (not for daily data updates: the app downloads new data on its own).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Validate bundled data
        run: node scripts/validate.mjs data/ukraine.json

      - name: Assemble web app and sync into Android project
        run: |
          node scripts/build-web.mjs
          npx cap sync android

      - name: Restore signing key from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing. See README > Signing key."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | head -5
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/UkraineOpsMap-${APP_VERSION_NAME}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${APP_VERSION_NAME}" "dist/UkraineOpsMap-${APP_VERSION_NAME}.apk" \
            --title "Ukraine Ops Map ${APP_VERSION_NAME}" \
            --notes "Signed Android build ${APP_VERSION_NAME} from commit ${GITHUB_SHA::7}. On your phone: download the .apk below, open it, and tap Install (or Update). Map data updates by itself every day; you do not need a new APK for that." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: UkraineOpsMap-${{ env.APP_VERSION_NAME }}
          path: dist/*.apk
          retention-days: 14
